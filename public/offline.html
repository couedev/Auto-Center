<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10130e">
    <title>Sem conexão | Auto CT</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f4f5ef; background: #0d0f0c; font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100%, 390px); padding: 30px 24px; border: 1px solid #30362a; border-radius: 24px; background: linear-gradient(145deg, #191d17, #11130f); text-align: center; }
      img { width: min(100%, 190px); height: auto; object-fit: contain; }
      h1 { margin: 16px 0 8px; font-size: 23px; }
      p { margin: 0; color: #b3b9ad; font-size: 14px; line-height: 1.55; }
      a { min-height: 46px; margin-top: 22px; display: grid; place-items: center; border-radius: 24px; color: #11170a; background: #a9f000; font-weight: 750; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/Auto%20CT%20transparent%20logo-2.webp" alt="Auto CT Auto Center">
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para consultar os serviços e seus agendamentos.</p>
      <a href="/aplicativo">Tentar novamente</a>
    </main>
  </body>
</html>
